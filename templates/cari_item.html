<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cari Item Penjualan</title>
  <link href="/static/lib/bootstrap.min.css" rel="stylesheet">
  <script src="/static/lib/jquery.min.js"></script>
  <style>
    .beda { background-color: #ffd6d6 !important; }   /* merah muda = data beda */
    .baru { background-color: #fff7cc !important; }   /* kuning = item baru (tidak ada di DB) */
    .sama { background-color: #d6ffd6 !important; }   /* hijau muda = cocok */
  </style>

</head>
<form action="/debug_pdf" method="post" enctype="multipart/form-data">
  <input type="file" name="file">
  <button type="submit">Debug PDF</button>
</form>
<body class="bg-light">
  <div class="container py-5">
    <div class="container py-5">
  <div class="row g-4">
    <!-- KIRI: Data dari Database -->
    <div class="col-md-6">
      <div class="card p-4 shadow-sm">
        <h4 class="mb-4">Data Item Penjualan Berdasarkan Nota</h4>
        <form id="formCari" class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Nomor Faktur</label>
            <input type="text" id="nomor_faktur" class="form-control" placeholder="Masukkan nomor faktur...">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Cari</button>
          </div>
          <div id="pdfViewerContainer" class="mt-3"></div>
        </form>

        <div id="pesan" class="alert mt-4" style="display:none;"></div>

        <div id="hasil" class="mt-4" style="display:none;">
          <h6>Data dari Database</h6>
          <table class="table table-bordered table-striped">
            <thead class="table-dark text-center">
              <tr>
                <th>No</th>
                <th>Nama Barang</th>
                <th>Jumlah</th>
                <th>Satuan</th>
                <th>Harga Jual</th>
                <th>Total Jual</th>
              </tr>
            </thead>
            <tbody id="tabelItem"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- KANAN: Upload & Hasil PDF -->
    <div class="col-md-6">
      <div class="card p-4 shadow-sm">
        <h4 class="mb-4">Upload Faktur PDF</h4>
        <form id="formPDF" enctype="multipart/form-data">
          <input type="file" id="file_pdf" name="file" accept=".pdf" class="form-control mb-3">
          <button type="submit" class="btn btn-success w-100">Upload & Baca PDF</button>
        </form>

        <div id="pdfMsg" class="alert mt-3" style="display:none;"></div>

        <div id="pdfResult" class="mt-3" style="display:none;">
          <h6>Data dari PDF</h6>
          <table class="table table-bordered table-striped">
            <thead class="table-dark text-center">
              <tr>
                <th>No</th>
                <th>Nama Barang</th>
                <th>Jumlah</th>
                <th>Satuan</th>
                <th>Harga Satuan</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="pdfItems"></tbody>
          </table>
          <div id="daftarArsip" class="mt-4">
            <em>Memuat daftar arsip...</em>
          </div>

          <div class="mt-3 text-center">
            <button id="sortByName" class="btn btn-secondary mb-2">
              Urutkan Berdasarkan Nama Barang (A–Z)
            </button>
            <button id="btnSimpanArsip" class="btn btn-outline-primary w-100" style="display:none;">
              💾 Simpan PDF sebagai Arsip
            </button>
            
            <hr class="my-4">
            <h6>📁 Daftar Arsip PDF</h6>
            <div id="daftarArsip" class="mt-2" style="max-height:200px; overflow:auto; border:1px solid #ccc; padding:10px; border-radius:8px;">
              <em>Belum ada arsip tersimpan.</em>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // === CARI DATA PENJUALAN ===
  $("#formCari").on("submit", function(e){
    e.preventDefault();
    let nomor_faktur = $("#nomor_faktur").val().trim();
    if(!nomor_faktur) return;

    $.get("/get_item_penjualan", {nomor_faktur: nomor_faktur}, function(res){
      if(res.status === "ok"){
        let rows = "";
        let no = 1;
        res.data.forEach(it => {
          rows += `
            <tr>
              <td>${no++}</td>
              <td>${it.nama_barang}</td>
              <td class="text-end">${parseFloat(it.jumlah).toLocaleString()}</td>
              <td>${it.satuan}</td>
              <td class="text-end">${parseFloat(it.harga_jual).toLocaleString()}</td>
              <td class="text-end">${parseFloat(it.total_jual).toLocaleString()}</td>
            </tr>`;
        });
        $("#tabelItem").html(rows);
        $("#hasil").show();
        $("#pesan").hide();

        // === Tambahan baru: cek PDF arsip otomatis ===
        $.get("/cek_arsip_pdf", { nomor_faktur: nomor_faktur }, function(pdfRes){
          if (pdfRes.status === "ok") {
            const fileUrl = pdfRes.file_url;
            const fileName = fileUrl.split("/").pop();
            console.log("📄 Arsip PDF ditemukan:", fileUrl);

            fetch(encodeURI(fileUrl))
              .then(res => {
                if (!res.ok) throw new Error("Gagal mengunduh PDF dari server");
                return res.blob();
              })
              .then(blob => {
                const formData = new FormData();
                formData.append("file", new File([blob], fileName, { type: "application/pdf" }));
                formData.append("nomor_faktur", nomor_faktur);

                $("#pdfMsg").removeClass().addClass("alert alert-info mt-3")
                  .html(`📂 Arsip PDF ditemukan (${fileName}) — sedang diproses otomatis...`).show();

                // === Kirim langsung ke /upload_pdf ===
                $.ajax({
                  url: "/upload_pdf",
                  type: "POST",
                  data: formData,
                  processData: false,
                  contentType: false,
                  success: function(res){
                    if(res.status === "ok"){
                      let rows = "";
                      let no = 1;
                      res.data.forEach(it => {
                        rows += `
                          <tr>
                            <td>${no++}</td>
                            <td>${it.nama_barang}</td>
                            <td class="text-end">${it.jumlah}</td>
                            <td>${it.satuan}</td>
                            <td class="text-end">${parseFloat(it.harga_satuan).toLocaleString()}</td>
                            <td class="text-end">${parseFloat(it.total_harga).toLocaleString()}</td>
                          </tr>`;
                      });
                      $("#pdfItems").html(rows);
                      $("#pdfResult").show();
                      $("#btnSimpanArsip").hide();
                      $("#pdfMsg").removeClass().addClass("alert alert-success mt-3")
                        .html(`✅ Arsip PDF (${fileName}) berhasil dibaca otomatis!`).show();
                    } else {
                      $("#pdfMsg").removeClass().addClass("alert alert-warning mt-3").html(res.message).show();
                    }
                  },
                  error: function(){
                    $("#pdfMsg").removeClass().addClass("alert alert-danger mt-3")
                      .html("❌ Gagal mengirim file PDF ke server.").show();
                  }
                });
              })
              .catch(err => {
                console.error("❌ Gagal mengambil PDF:", err);
                $("#pdfMsg").removeClass().addClass("alert alert-warning mt-3")
                  .html("⚠️ Gagal memuat arsip PDF. Silakan unggah manual.").show();
              });
          } else {
            $("#pdfMsg").removeClass().addClass("alert alert-secondary mt-3")
              .html("ℹ️ Arsip PDF belum tersedia. Silakan unggah baru.").show();
          }
        });

      } else {
        $("#pesan").removeClass().addClass("alert alert-warning").html(res.message).show();
        $("#hasil").hide();
        $("#pdfViewerContainer").empty();
        $("#formPDF").show();
      }
    }).fail(() => {
      $("#pesan").removeClass().addClass("alert alert-danger").html("Gagal mengambil data dari server.").show();
      $("#hasil").hide();
      $("#pdfViewerContainer").empty();
      $("#formPDF").show();
    });
  });


  // === UPLOAD DAN BACA PDF ===
  $("#formPDF").on("submit", function(e){
    e.preventDefault();
    let formData = new FormData(this);
    $("#pdfMsg").hide();
    $("#pdfResult").hide();

    $.ajax({
      url: "/upload_pdf",
      type: "POST",
      data: formData,
      processData: false,
      contentType: false,
      success: function(res){
        if(res.status === "ok"){
          let rows = "";
          let no = 1;
          res.data.forEach(it => {
            rows += `
              <tr>
                <td>${no++}</td>
                <td>${it.nama_barang}</td>
                <td class="text-end">${it.jumlah}</td>
                <td>${it.satuan}</td>
                <td class="text-end">${parseFloat(it.harga_satuan).toLocaleString()}</td>
                <td class="text-end">${parseFloat(it.total_harga).toLocaleString()}</td>
              </tr>`;
          });
          $("#pdfItems").html(rows);
          $("#pdfResult").show();
          $("#btnSimpanArsip").show();
        } else {
          $("#pdfMsg").removeClass().addClass("alert alert-warning").html(res.message).show();
        }
      },
      error: function(){
        $("#pdfMsg").removeClass().addClass("alert alert-danger").html("Gagal membaca file PDF.").show();
      }
    });
  });

  // === SIMPAN FILE PDF SEBAGAI ARSIP ===
  $("#btnSimpanArsip").on("click", function(){
    const nomor_faktur = $("#nomor_faktur").val().trim();
    if(!nomor_faktur){
      alert("⚠️ Harap isi nomor faktur terlebih dahulu sebelum menyimpan arsip!");
      return;
    }

    const fileInput = $("#file_pdf")[0];
    if(!fileInput.files.length){
      alert("⚠️ Tidak ada file PDF yang diunggah!");
      return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("nomor_faktur", nomor_faktur);

    $.ajax({
      url: "/simpan_arsip_pdf",
      type: "POST",
      data: formData,
      processData: false,
      contentType: false,
      success: function(res){
        if(res.status === "ok"){
          alert("✅ File PDF berhasil disimpan sebagai arsip!");
        } else {
          alert("⚠️ Gagal menyimpan arsip: " + res.message);
        }
      },
      error: function(){
        alert("❌ Terjadi kesalahan saat menyimpan arsip PDF.");
      }
    });
  });

  // === STYLE HIGHLIGHT HASIL PERBANDINGAN ===
  const style = document.createElement("style");
  style.innerHTML = `
    .sama { background-color: #d6ffd6 !important; }
    .beda { background-color: #ffcccc !important; }
    .baru { background-color: #fff7cc !important; }
  `;
  document.head.appendChild(style);

  // === FUNGSI PENDUKUNG ===
  function ambilDataDariTabel(selector) {
    const rows = [];
    document.querySelectorAll(selector + " tr").forEach(tr => {
      const cols = tr.querySelectorAll("td");
      if (cols.length > 1) {
        rows.push({
          nama: cols[1].innerText.trim(),
          jumlah: cols[2].innerText.trim(),
          satuan: cols[3].innerText.trim(),
          harga: cols[4].innerText.trim(),
          total: cols[5].innerText.trim()
        });
      }
    });
    return rows;
  }

  document.getElementById("sortByName").addEventListener("click", function() {
    const dbData = ambilDataDariTabel("#tabelItem");
    const pdfData = ambilDataDariTabel("#pdfItems");
    dbData.sort((a, b) => a.nama.localeCompare(b.nama, "id", { sensitivity: "base" }));
    pdfData.sort((a, b) => a.nama.localeCompare(b.nama, "id", { sensitivity: "base" }));
    renderTabel("#tabelItem", dbData);
    renderTabel("#pdfItems", pdfData);
  });

  function renderTabel(selector, data) {
    const tbody = document.querySelector(selector);
    tbody.innerHTML = "";
    let no = 1;
    data.forEach(it => {
      tbody.innerHTML += `
        <tr>
          <td>${no++}</td>
          <td>${it.nama}</td>
          <td class="text-end">${it.jumlah}</td>
          <td>${it.satuan}</td>
          <td class="text-end">${it.harga}</td>
          <td class="text-end">${it.total}</td>
        </tr>`;
    });
  }

  function bandingkanTabel() {
    const dbData = ambilDataDariTabel("#tabelItem");
    const pdfData = ambilDataDariTabel("#pdfItems");
    if (dbData.length === 0 || pdfData.length === 0) {
      alert("⚠️ Pastikan kedua tabel sudah tampil sebelum membandingkan!");
      return;
    }
    const mapDB = {};
    dbData.forEach(it => mapDB[it.nama.toLowerCase()] = it);
    document.querySelectorAll("#pdfItems tr").forEach(tr => {
      const nama = tr.children[1].innerText.trim().toLowerCase();
      const jumlah = parseFloat(tr.children[2].innerText.replace(",", ".")) || 0;
      const harga = parseFloat(tr.children[4].innerText.replace(/[.,]/g, "")) || 0;
      let kelas = "baru";
      if (mapDB[nama]) {
        const db = mapDB[nama];
        const dbJumlah = parseFloat(db.jumlah.replace(",", ".")) || 0;
        const dbHarga = parseFloat(db.harga.replace(/[.,]/g, "")) || 0;
        const bedaJumlah = Math.abs(jumlah - dbJumlah) > 0.001;
        const bedaHarga = Math.abs(harga - dbHarga) > 10;
        kelas = (bedaJumlah || bedaHarga) ? "beda" : "sama";
      }
      tr.className = kelas;
    });
    alert("✅ Perbandingan selesai — periksa warna di tabel PDF!");
  }

  $(document).ajaxSuccess(function(event, xhr, settings) {
    if (settings.url === "/upload_pdf") {
      setTimeout(bandingkanTabel, 500);
    }
  });

  // === MUAT DAFTAR ARSIP PDF YANG ADA ===
  function muatDaftarArsip() {
    $.get("/get_daftar_arsip", function(res) {
      if (res.status === "ok" && res.data.length > 0) {
        let html = `
          <h6 class="fw-bold">📁 Daftar Arsip PDF</h6>
          <div class="list-group mt-2">`;

        res.data.forEach(f => {
          html += `
            <a href="${f.url}" target="_blank" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
              <span>${f.nama}</span>
              <span class="badge bg-primary">Lihat</span>
            </a>`;
        });

        html += `</div>`;
        $("#daftarArsip").html(html);
      } else {
        $("#daftarArsip").html("<em>Belum ada arsip PDF tersimpan.</em>");
      }
    }).fail(() => {
      $("#daftarArsip").html("<span class='text-danger'>Gagal memuat daftar arsip.</span>");
    });
  }

  // === MUAT SAAT HALAMAN DIBUKA ===
  $(document).ready(function(){
    muatDaftarArsip();
  });

  // === MUAT ULANG SETELAH SIMPAN ARSIP ===
  $(document).ajaxSuccess(function(event, xhr, settings){
    if (settings.url === "/simpan_arsip_pdf") {
      setTimeout(muatDaftarArsip, 800);
    }
  });

</script>


<style>
  /* Warna latar untuk hasil banding */
  #pdfItems tr.sama {
    background-color: #d6ffd6 !important; /* hijau muda */
  }
  #pdfItems tr.beda {
    background-color: #ffd6d6 !important; /* merah muda */
  }
  #pdfItems tr.baru {
    background-color: #fff7cc !important; /* kuning muda */
  }

  /* Supaya efek terlihat jelas meski ada table-striped Bootstrap */
  #pdfItems tr.sama td,
  #pdfItems tr.beda td,
  #pdfItems tr.baru td {
    background-color: inherit !important;
  }
</style>

</body>
</html>
