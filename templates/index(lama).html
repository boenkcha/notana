<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Input Nota Belanja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    /* --- Base page --- */
    :root{
      --card-radius: 12px;
      --muted: #6b7280;
      --accent-1: #2563eb; /* blue-600 */
      --accent-2: #4f46e5; /* indigo-600 */
    }
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f1f5f9 100%);
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial;
      padding: 28px 12px;
    }

    /* --- Card --- */
    .card-custom {
      background: rgba(255,255,255,0.85);
      border: 0;
      border-radius: var(--card-radius);
      box-shadow: 0 10px 30px rgba(15,23,42,0.08);
      overflow: hidden;
    }

    .card-header-custom {
      padding: 18px 20px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      color: #fff;
      display:flex;
      align-items:center;
      gap:14px;
    }
    .card-header-custom .icon-wrap {
      background: rgba(255,255,255,0.12);
      padding:8px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card-header-custom h1 { font-size: 1.25rem; margin:0; font-weight:600; }
    .card-header-custom p { margin:0; font-size:0.86rem; color: rgba(255,255,255,0.9); }

    .card-body-custom {
      padding: 22px;
    }

    /* --- Form fields --- */
    .label-muted { color: var(--muted); font-size:0.9rem; }
    .input-ghost {
      border: 1px solid #e6e9ef;
      border-radius:8px;
      height:42px;
      padding:8px 12px;
      background:#fff;
    }

    /* --- Separator like Figma --- */
    .sep {
      height:1px;
      background: linear-gradient(90deg, rgba(0,0,0,0.03), rgba(0,0,0,0.06));
      margin: 18px 0;
      border-radius:2px;
    }

    /* --- Items list --- */
    .items-grid .item-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding:14px;
      border-radius:10px;
      background:#ffffff;
      border: 1px solid #eef2f6;
      transition: box-shadow .18s, border-color .18s;
    }
    @media(min-width:768px){
      .items-grid .item-row {
        grid-template-columns: repeat(12, 1fr);
        align-items: center;
      }
    }
    .items-grid .col-name { grid-column: span 1; }
    @media(min-width:768px){
      .items-grid .col-name { grid-column: span 4; }
      .items-grid .col-qty { grid-column: span 2; }
      .items-grid .col-unit { grid-column: span 2; }
      .items-grid .col-price { grid-column: span 3; }
      .items-grid .col-action { grid-column: span 1; display:flex; align-items:center; justify-content:center; }
    }

    .items-grid .item-row:hover { border-color: rgba(37,99,235,0.22); box-shadow: 0 6px 18px rgba(15,23,42,0.04); }

    .small-muted { color:#94a3b8; font-size:0.85rem; }

    /* --- Buttons --- */
    .btn-primary-gradient {
      background: linear-gradient(90deg, #16a34a, #059669);
      color: #fff;
      border: none;
      box-shadow: 0 6px 18px rgba(5,150,105,0.18);
      border-radius:8px;
      padding:10px 16px;
    }
    .btn-outline-accent {
      border:1px solid #cfe7ff;
      color: #2563eb;
      background:transparent;
      border-radius:8px;
      padding:8px 12px;
    }

    /* --- Misc --- */
    .grand-box {
      background: linear-gradient(90deg,#eef2ff,#eef6ff);
      border:1px solid #dbeafe;
      padding:14px 18px;
      border-radius:10px;
      min-width:260px;
    }

    .icon-btn {
      background:transparent;
      border:0;
      font-size:18px;
      cursor:pointer;
      height:38px;
      width:38px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:8px;
    }
    .icon-btn:disabled { opacity:0.45; cursor:not-allowed; }

    .list-suggestions { z-index:1100; max-height:220px; overflow:auto; }
    .select-ghost {
      border:1px solid #e6eefc;
      background:#fff;
      border-radius:8px;
      height:42px;
      padding:6px 10px;
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
    }

    /* === Riwayat Harga Timeline === */
    .timeline-item {
      position: relative;
      padding-left: 32px;
      margin-bottom: 22px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 4px;
      width: 12px;
      height: 12px;
      background: #2563eb;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .timeline-line {
      position: absolute;
      left: 15px;
      top: 20px;
      width: 2px;
      height: calc(100% - 10px);
      background: rgba(0, 0, 0, 0.1);
    }

    .timeline-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 10px;
      padding: 14px 18px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .badge-change {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

  </style>
</head>
<body>
  <div class="container" style="max-width:980px;">
    <div class="card card-custom mt-4">
      <!-- Header -->
      <div class="card-header-custom">
        <div class="icon-wrap">
          <i class="bi bi-receipt" style="font-size:20px; color:white;"></i>
        </div>
        <div>
          <h1>Input Nota Belanja</h1>
          <p>Formulir input pembelian barang</p>
        </div>
      </div>

      <!-- Body -->
      <div class="card-body-custom">
        <form id="notaForm" method="post" action="/prepare">
          <!-- Header info (3 columns) -->
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label class="label-muted d-flex align-items-center gap-2" for="tanggal">
                <i class="bi bi-calendar-event" style="font-size:14px;color:var(--muted)"></i> Tanggal
              </label>
              <input id="tanggal" name="tanggal" type="date" class="form-control input-ghost" value="{{today}}" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="label-muted" for="supplier">Supplier</label>
              <input id="supplier" name="supplier" type="text" class="form-control input-ghost" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="label-muted" for="nomor_faktur">Nomor Faktur / Nota</label>
              <input id="nomor_faktur" name="nomor_faktur" type="text" class="form-control input-ghost" placeholder="cth: INV-2025-010" required>
            </div>
          </div>

          <div class="sep" role="separator" aria-hidden="true"></div>

          <!-- Items Section -->
          <div class="mb-3">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h5 style="margin:0; font-weight:600;">Daftar Barang</h5>
            </div>

            <!-- Table header for desktop -->
            <div class="d-none d-md-grid" style="grid-template-columns: repeat(12,1fr); gap:12px; padding:10px; border-radius:10px; background:#f8fafc; border:1px solid #eef2ff;">
              <div style="grid-column: span 4;" class="small-muted">Nama Barang</div>
              <div style="grid-column: span 2;" class="small-muted">Jumlah</div>
              <div style="grid-column: span 2;" class="small-muted">Satuan</div>
              <div style="grid-column: span 3;" class="small-muted">Harga</div>
              <div style="grid-column: span 1;"></div>
            </div>

            <!-- Items container -->
            <div id="items" class="mt-3 items-grid">
              <!-- initial row (id row_0) - kept ids/names to match backend -->
              <div class="item-row" id="row_0">
                <div class="col-name">
                  <label class="d-md-none small-muted">Nama Barang</label>
                  <input type="text" class="form-control nama-barang input-ghost" name="nama_0" id="nama_0" placeholder="Nama Barang" required autocomplete="off">
                  <div id="suggestions_0" class="list-group position-absolute list-suggestions w-100" style="display:none;"></div>
                </div>

                <div class="col-qty mt-2 mt-md-0">
                  <label class="d-md-none small-muted">Jumlah</label>
                  <input type="number" class="form-control input-ghost" name="jumlah_0" id="jumlah_0" step="any" value="1" placeholder="Qty" required>
                </div>

                <div class="col-unit mt-2 mt-md-0">
                  <label class="d-md-none small-muted">Satuan</label>
                  <input type="text" class="form-control input-ghost" name="satuan_0" id="satuan_0" placeholder="Satuan" required>
                </div>

                <div class="col-price mt-2 mt-md-0" style="position:relative;">
                  <label class="d-md-none small-muted">Harga</label>
                  <div style="position:relative;">
                    <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:0.95rem; color:#6b7280;">Rp</span>
                    <input type="number" class="form-control harga-barang input-ghost" name="harga_0" id="harga_0" step="any" value="0" placeholder="Harga Satuan" style="padding-left:44px;" required>
                  </div>
                </div>

                <div class="col-action mt-2 mt-md-0 text-center">
                  <div class="d-flex gap-2 justify-content-center">
                    <button type="button" class="icon-btn" title="Riwayat Harga"><i class="bi bi-graph-up"></i></button>
                    <button type="button" class="icon-btn" onclick="hapusBarang(0)" title="Hapus"><i class="bi bi-trash" style="color:#dc3545"></i></button>
                  </div>
                </div>

                <!-- mobile subtotal -->
                <div class="d-md-none" style="grid-column:1/span 1; border-top:1px dashed #eef2f6; padding-top:10px; margin-top:8px;">
                  <div class="d-flex justify-content-between small-muted">
                    <span>Subtotal:</span>
                    <span class="font-weight-bold subtotal-mobile">Rp <span class="subtotal-text">0</span></span>
                  </div>
                </div>
              </div>
            </div>

            <!-- controls -->
            <div class="d-flex gap-2 mt-3">
              <button type="button" id="tambahBarangBtn" class="btn btn-outline-accent d-flex align-items-center gap-2">
                <i class="bi bi-plus-lg"></i> Tambah Barang
              </button>

              <button type="submit" class="btn btn-primary-gradient d-flex align-items-center gap-2">
                <i class="bi bi-save" style="font-size:16px;"></i> Simpan Nota
              </button>

              <div class="ms-auto d-none d-md-block" style="min-width:240px;">
                <select id="lanjutkanNota" class="form-select select-ghost w-100">
                  <option value="">🧾 Lanjutkan Nota Lama...</option>
                </select>
              </div>
            </div>

            <!-- mobile select -->
            <div class="mt-3 d-md-none">
              <select id="lanjutkanNota_mobile" class="form-select">
                <option value="">🧾 Lanjutkan Nota Lama...</option>
              </select>
            </div>
          </div>

          <div class="sep"></div>

          <!-- total + actions -->
          <div class="d-flex flex-column flex-md-row gap-3 align-items-start">
            <div class="ms-auto grand-box">
              <div class="d-flex justify-content-between align-items-center">
                <span class="small-muted">Total:</span>
                <span id="grand_total" class="fs-4 text-primary">0</span>
              </div>
            </div>
          </div>

          <input type="hidden" id="count" name="count" value="1">
        </form>

        <div class="mt-3 d-flex gap-2">
          <button id="btnReport" class="btn btn-outline-secondary"><i class="bi bi-file-earmark-text me-2"></i> Lihat Report Harian</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Riwayat Harga -->
  <div class="modal fade" id="riwayatModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header" style="background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#fff;">
          <h5 class="modal-title">Riwayat Harga: <span id="riwayatNama"></span></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="riwayatContainer"><p class="text-muted">Memuat data...</p></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  /***** KEEP YOUR ORIGINAL LOGIC (converted for new markup where needed) *****/

  // === Fungsi global untuk update subtotal dan grand total ===
  function updateSubtotal() {
    let total = 0;
    $(".item-row").each(function() {
      const jumlah = parseFloat($(this).find("[id^='jumlah_']").val()) || 0;
      const harga = parseFloat($(this).find(".harga-barang").val()) || 0;
      const subtotal = jumlah * harga;
      // set subtotal field if exists (original had readonly inputs per row; in new markup we don't show a dedicated subtotal input
      // but keep showing grand_total and mobile subtotal)
      $(this).find(".subtotal-barang").val && $(this).find(".subtotal-barang").val(subtotal.toFixed(0));
      $(this).find(".subtotal-text").text(subtotal.toLocaleString());
      total += subtotal;
    });
    $("#grand_total").text(total.toLocaleString());
  }

  // Fungsi hapus baris
  function hapusBarang(idx) {
    $("#row_" + idx).remove();
    updateSubtotal();
    // adjust count
    const cnt = $(".item-row").length;
    $("#count").val(cnt);
  }

  $(document).on("focus", "input[type='text'], input[type='number']", function() {
    $(this).select();
  });
  $(document).on("mouseup", "input[type='text'], input[type='number']", function(e) {
    e.preventDefault();
  });

  $(document).ready(function() {
    // Hitung total otomatis
    $(document).on("input", ".harga-barang, .nama-barang, [id^='jumlah_']", function() {
      updateSubtotal();
    });

    function tambahBarangBaru() {
      const idx = $(".item-row").length;
      const id = idx;
      const row = `
        <div class="item-row" id="row_${id}">
          <div class="col-name">
            <label class="d-md-none small-muted">Nama Barang</label>
            <input type="text" class="form-control nama-barang input-ghost" name="nama_${id}" id="nama_${id}" placeholder="Nama Barang" required autocomplete="off">
            <div id="suggestions_${id}" class="list-group position-absolute list-suggestions w-100" style="display:none;"></div>
          </div>

          <div class="col-qty mt-2 mt-md-0">
            <label class="d-md-none small-muted">Jumlah</label>
            <input type="number" class="form-control input-ghost" name="jumlah_${id}" id="jumlah_${id}" step="any" value="1" placeholder="Qty" required>
          </div>

          <div class="col-unit mt-2 mt-md-0">
            <label class="d-md-none small-muted">Satuan</label>
            <input type="text" class="form-control input-ghost" name="satuan_${id}" id="satuan_${id}" placeholder="Satuan" required>
          </div>

          <div class="col-price mt-2 mt-md-0" style="position:relative;">
            <label class="d-md-none small-muted">Harga</label>
            <div style="position:relative;">
              <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:0.95rem; color:#6b7280;">Rp</span>
              <input type="number" class="form-control harga-barang input-ghost" name="harga_${id}" id="harga_${id}" step="any" value="0" placeholder="Harga Satuan" style="padding-left:44px;" required>
            </div>
          </div>

          <div class="col-action mt-2 mt-md-0 text-center">
            <div class="d-flex gap-2 justify-content-center">
              <button type="button" class="icon-btn btn-riwayat" title="Riwayat Harga"><i class="bi bi-graph-up"></i></button>
              <button type="button" class="icon-btn btn-hapus" onclick="hapusBarang(${id})" title="Hapus"><i class="bi bi-trash" style="color:#dc3545"></i></button>
            </div>
          </div>

          <div class="d-md-none" style="grid-column:1/span 1; border-top:1px dashed #eef2f6; padding-top:10px; margin-top:8px;">
            <div class="d-flex justify-content-between small-muted">
              <span>Subtotal:</span>
              <span class="font-semibold subtotal-text">0</span>
            </div>
          </div>
        </div>
      `;
      $("#items").append(row);
      $("#count").val($(".item-row").length);
      $(`#nama_${id}`).focus();
    }

    function cekFuzzyDanTambah(idx) {
      // idx is index of last current row
      const nama = $(`#nama_${idx}`).val().trim();
      if (nama === "") return alert("Nama barang belum diisi!");
      $.getJSON(`/cek_fuzzy_barang?q=${encodeURIComponent(nama)}`, function(res) {
        if (res.match && res.match.toLowerCase() !== nama.toLowerCase()) {
          const yakin = confirm(`⚠️ Nama barang mirip dengan "${res.match}". Apakah tetap ingin menambahkan?`);
          if (!yakin) { $(`#nama_${idx}`).focus().select(); return; }
        }
        tambahBarangBaru();
      }).fail(function(){
        // jika endpoint gagal, tetap tambah untuk tidak mengganggu alur
        tambahBarangBaru();
      });
    }

    $("#tambahBarangBtn").on("click", function() {
      const idx = $(".item-row").length - 1;
      cekFuzzyDanTambah(idx);
    });

    $(document).on("keydown", "input", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        const id = $(this).attr("id");
        if (id && id.startsWith("harga_")) {
          const idx = id.split("_")[1];
          cekFuzzyDanTambah(idx);
        }
      }
    });

    // === Autocomplete & Harga otomatis ===
    $(document).on("input", ".nama-barang", function() {
      let input = $(this);
      let term = input.val().trim();
      let idx = input.attr("id").split("_")[1];
      let sugBox = $("#suggestions_" + idx);
      if (term.length < 2) { sugBox.hide(); return; }

      $.getJSON("/cari_barang", { q: term }, function(data) {
        let list = data.results || [];
        if (list.length === 0) { sugBox.hide(); return; }

        let html = list.map(item =>
          `<button type="button" class="list-group-item list-group-item-action"
              data-nama="${item.nama}" data-satuan="${item.satuan}" data-harga="${item.harga}">
              ${item.nama}
          </button>`
        ).join("");
        sugBox.html(html).show();
      }).fail(function(){
        // jika gagal, sembunyikan saran
        sugBox.hide();
      });
    });

    $(document).on("click", ".list-group-item", function() {
      let btn = $(this);
      let parent = btn.closest(".item-row");
      let nama = btn.data("nama");
      parent.find(".nama-barang").val(nama);
      parent.find("input[id^='satuan_']").val(btn.data("satuan"));
      btn.parent().hide();

      $.getJSON(`/get_harga_terbaru?nama=${encodeURIComponent(nama)}`, function(res) {
        let hargaInput = parent.find("input[id^='harga_']");

        if (res.harga !== null && res.harga !== undefined) {
          hargaInput.val(res.harga);
        } else {
          // fallback dari autoshow (kalau endpoint gagal / kosong)
          hargaInput.val(btn.data("harga"));
        }

        // efek visual
        hargaInput.css({
          "background-color": "#e7f5ff",
          "transition": "background-color 0.5s ease"
        });
        setTimeout(() => hargaInput.css("background-color", ""), 800);

        parent.find("input[id^='jumlah_']").focus();
        updateSubtotal();
      })
      .fail(function(){
        // hard fallback
        parent.find("input[id^='harga_']").val(btn.data("harga"));
        updateSubtotal();
      });

    });

    $(document).click(function(e) {
      if (!$(e.target).closest(".nama-barang, .list-group").length) {
        $(".list-group").hide();
      }
    });

    // === FITUR LANJUTKAN NOTA LAMA ===
    function populateLanjutkan(notelist){
      if (!notelist) return;
      notelist.forEach(n => {
        $("#lanjutkanNota").append(`<option value="${n.nomor_faktur}">${n.nomor_faktur} - ${n.supplier}</option>`);
        $("#lanjutkanNota_mobile").append(`<option value="${n.nomor_faktur}">${n.nomor_faktur} - ${n.supplier}</option>`);
      });
    }

    $.getJSON("/get_all_nota", function(res) {
      if (res.status === "ok") {
        populateLanjutkan(res.notas);
      }
    }).fail(function(){ /* ignore */ });

    $("#lanjutkanNota, #lanjutkanNota_mobile").on("change", function() {
      const faktur = $(this).val();
      if (!faktur) return;

      $.getJSON(`/get_nota_detail?nomor_faktur=${encodeURIComponent(faktur)}`, function(res) {
        if (res.status !== "ok") return alert("Nota tidak ditemukan!");

        $("input[name='tanggal']").val(res.tanggal);
        $("input[name='supplier']").val(res.supplier);
        $("input[name='nomor_faktur']").val(res.nomor_faktur);
        $("#items").empty();

        res.items.forEach((it, i) => {
          const row = `
            <div class="item-row" id="row_${i}">
              <div class="col-name">
                <label class="d-md-none small-muted">Nama Barang</label>
                <input type="text" class="form-control nama-barang input-ghost" name="nama_${i}" id="nama_${i}" value="${it.nama_barang}" required autocomplete="off">
                <div id="suggestions_${i}" class="list-group position-absolute list-suggestions w-100" style="display:none;"></div>
              </div>

              <div class="col-qty mt-2 mt-md-0">
                <label class="d-md-none small-muted">Jumlah</label>
                <input type="number" class="form-control input-ghost" name="jumlah_${i}" id="jumlah_${i}" step="any" value="${it.jumlah}" required>
              </div>

              <div class="col-unit mt-2 mt-md-0">
                <label class="d-md-none small-muted">Satuan</label>
                <input type="text" class="form-control input-ghost" name="satuan_${i}" id="satuan_${i}" value="${it.satuan}" required>
              </div>

              <div class="col-price mt-2 mt-md-0" style="position:relative;">
                <label class="d-md-none small-muted">Harga</label>
                <div style="position:relative;">
                  <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:0.95rem; color:#6b7280;">Rp</span>
                  <input type="number" class="form-control harga-barang input-ghost" name="harga_${i}" id="harga_${i}" step="any" value="${it.harga_satuan}" style="padding-left:44px;" required>
                </div>
              </div>

              <div class="col-action mt-2 mt-md-0 text-center">
                <div class="d-flex gap-2 justify-content-center">
                  <button type="button" class="icon-btn btn-riwayat" title="Riwayat Harga"><i class="bi bi-graph-up"></i></button>
                  <button type="button" class="icon-btn btn-hapus" onclick="hapusBarang(${i})" title="Hapus"><i class="bi bi-trash" style="color:#dc3545"></i></button>
                </div>
              </div>

              <div class="d-md-none" style="grid-column:1/span 1; border-top:1px dashed #eef2f6; padding-top:10px; margin-top:8px;">
                <div class="d-flex justify-content-between small-muted">
                  <span>Subtotal:</span>
                  <span class="font-semibold subtotal-text">${(it.jumlah * it.harga_satuan).toLocaleString ? (it.jumlah * it.harga_satuan).toLocaleString() : it.total_harga}</span>
                </div>
              </div>
            </div>
          `;
          $("#items").append(row);
        });

        $("#count").val(res.items.length);
        updateSubtotal();
        alert(`Nota ${res.nomor_faktur} berhasil dimuat.`);
      }).fail(function(){ alert("Gagal memuat nota."); });
    });

    // === Handler Tombol Riwayat Harga ===
    $(document).on("click", ".btn-riwayat", function() {
      const $row = $(this).closest(".item-row");
      const nama = $row.find(".nama-barang").val().trim();
      if (!nama) { 
        alert("Isi nama barang dulu sebelum lihat riwayat!"); 
        return; 
      }

      $("#riwayatNama").text(nama);
      $("#riwayatContainer").html("<p class='text-muted'>Memuat data...</p>");
      const modalEl = document.getElementById("riwayatModal");
      const modal = new bootstrap.Modal(modalEl);
      modal.show();

      $.getJSON(`/riwayat_harga?nama=${encodeURIComponent(nama)}`, function(res) {
        if (!res || res.status !== "ok" || !res.data || res.data.length === 0) {
          $("#riwayatContainer").html("<p class='text-muted'>Tidak ada riwayat harga.</p>");
          return;
        }

        // --- Urutkan dari lama ke baru ---
        let arr = [...res.data].sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

        let lastBuy = null;
        let lastSell = null;

        // Hitung perubahan harga masing-masing jenis
        arr.forEach(row => {
            const jenis = row.jenis;
            const harga = Number(row.harga_beli || row.harga_jual);

            if (jenis === "BELI") {
                if (lastBuy === null) row.change = "STABIL";
                else if (harga > lastBuy) row.change = "NAIK";
                else if (harga < lastBuy) row.change = "TURUN";
                else row.change = "STABIL";

                lastBuy = harga;
            }

            if (jenis === "JUAL") {
                if (lastSell === null) row.change = "STABIL";
                else if (harga > lastSell) row.change = "NAIK";
                else if (harga < lastSell) row.change = "TURUN";
                else row.change = "STABIL";

                lastSell = harga;
            }
        });

        // Gabungkan berdasarkan tanggal
        let grouped = {};
        arr.forEach(r => {
            if (!grouped[r.tanggal]) {
                grouped[r.tanggal] = { tanggal: r.tanggal, beli: null, jual: null };
            }
            if (r.jenis === "BELI") grouped[r.tanggal].beli = r;
            if (r.jenis === "JUAL") grouped[r.tanggal].jual = r;
        });

        // Ambil urutan terbaru → lama
        let rowsArr = Object.values(grouped).sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

        let rows = rowsArr.map(g => {

          // ======================
          // FORMAT BELI
          // ======================
          let beliLine = "BELI: -";
          let beliColor = "";

          if (g.beli) {
              let harga = Number(g.beli.harga_beli) || 0;
              let prev = g.beli.prev !== null && g.beli.prev !== undefined
                  ? Number(g.beli.prev).toLocaleString("id-ID")
                  : null;

              let hargaFmt = "Rp " + harga.toLocaleString("id-ID");

              let arrow =
                  g.beli.change === "NAIK" ? "↑" :
                  g.beli.change === "TURUN" ? "↓" :
                  "→";

              beliColor =
                  g.beli.change === "NAIK" ? "color:#15803d;" :
                  g.beli.change === "TURUN" ? "color:#b91c1c;" :
                  "color:#92400e;";

              if (prev) {
                  beliLine = `BELI: ${hargaFmt} (${arrow} dari Rp ${prev})`;
              } else {
                  beliLine = `BELI: ${hargaFmt} (${arrow})`;
              }
          }

          // ======================
          // FORMAT JUAL
          // ======================
          let jualLine = "JUAL: -";
          let jualColor = "";

          if (g.jual) {
              let harga = Number(g.jual.harga_jual) || 0;
              let prev = g.jual.prev !== null && g.jual.prev !== undefined
                  ? Number(g.jual.prev).toLocaleString("id-ID")
                  : null;

              let hargaFmt = "Rp " + harga.toLocaleString("id-ID");

              let arrow =
                  g.jual.change === "NAIK" ? "↑" :
                  g.jual.change === "TURUN" ? "↓" :
                  "→";

              jualColor =
                  g.jual.change === "NAIK" ? "color:#15803d;" :
                  g.jual.change === "TURUN" ? "color:#b91c1c;" :
                  "color:#92400e;";

              if (prev) {
                  jualLine = `JUAL: ${hargaFmt} (${arrow} dari Rp ${prev})`;
              } else {
                  jualLine = `JUAL: ${hargaFmt} (${arrow})`;
              }
          }

          // ======================
          // TEMPLATE CARD DUA KOLOM
          // ======================
          return `
              <div class="p-2 mb-2 shadow-sm rounded-3"
                  style="background:#ffffff; border:1px solid #e5e7eb;">

                  <!-- HEADER TANGGAL -->
                  <div class="d-flex align-items-center mb-2">
                      <span class="me-1" style="font-size:16px;">📅</span>
                      <span class="fw-bold" style="font-size:0.95rem;">${g.tanggal}</span>
                  </div>

                  <div class="row gx-2">

                      <!-- ========== BELI ========== -->
                      <div class="col-6 border-end">
                          <div class="text-muted" style="font-size:0.7rem; margin-bottom:2px;">Pembelian</div>

                          ${
                              g.beli
                              ? `
                                  <span class="badge px-2 py-1 mb-1"
                                      style="
                                          background:#dbeafe;
                                          color:#1e3a8a;
                                          font-size:0.7rem;
                                          border-radius:8px;
                                          font-weight:600;
                                      ">
                                      BELI — Rp ${Number(g.beli.harga_beli).toLocaleString("id-ID")}
                                  </span>

                                  <div class="fw-semibold" style="font-size:0.75rem; ${beliColor}">
                                      ${
                                          g.beli.prev
                                          ? `${g.beli.change === "NAIK" ? "⬆️" :
                                              g.beli.change === "TURUN" ? "⬇️" : "⟲"
                                            } ${g.beli.change} dari Rp ${Number(g.beli.prev).toLocaleString("id-ID")}`
                                          : `${g.beli.change}`
                                      }
                                  </div>

                                  <div class="text-muted" style="font-size:0.65rem;">
                                      Supplier: ${g.beli.pihak || "-"}
                                  </div>
                              `
                              : `<span class="badge bg-light text-muted px-2 py-1" style="font-size:0.7rem;">Tidak ada</span>`
                          }

                      </div>

                      <!-- ========== JUAL ========== -->
                      <div class="col-6">
                          <div class="text-muted" style="font-size:0.7rem; margin-bottom:2px;">Penjualan</div>

                          ${
                              g.jual
                              ? `
                                  <span class="badge px-2 py-1 mb-1"
                                      style="
                                          background:#fee2e2;
                                          color:#991b1b;
                                          font-size:0.7rem;
                                          border-radius:8px;
                                          font-weight:600;
                                      ">
                                      JUAL — Rp ${Number(g.jual.harga_jual).toLocaleString("id-ID")}
                                  </span>

                                  <div class="fw-semibold" style="font-size:0.75rem; ${jualColor}">
                                      ${
                                          g.jual.prev
                                          ? `${g.jual.change === "NAIK" ? "⬆️" :
                                              g.jual.change === "TURUN" ? "⬇️" : "⟲"
                                            } ${g.jual.change} dari Rp ${Number(g.jual.prev).toLocaleString("id-ID")}`
                                          : `${g.jual.change}`
                                      }
                                  </div>

                                  <div class="text-muted" style="font-size:0.65rem;">
                                      Konsumen: ${g.jual.pihak || "-"}
                                  </div>
                              `
                              : `<span class="badge bg-light text-muted px-2 py-1" style="font-size:0.7rem;">Tidak ada</span>`
                          }

                      </div>

                  </div>
              </div>
          `;


      }).join("");


        $("#riwayatContainer").html(rows);


      })
      .fail(function() {
        $("#riwayatContainer").html("<p class='text-muted'>Gagal memuat riwayat.</p>");
      });
    });


    // Report button
    $("#btnReport").on("click", function(){ window.location.href = "/report"; });

    // initial subtotal calc
    updateSubtotal();
  });
  </script>
</body>
</html>
